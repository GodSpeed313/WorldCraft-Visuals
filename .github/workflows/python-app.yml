# Tests the Mythos-Sync engine on every push and pull request.
#
# The engine is standard-library only and the core suite uses unittest rather
# than pytest to keep it that way. That property is now PROVEN rather than
# assumed: the core suite runs first, before anything is installed, and would
# fail there if the engine or test_engine.py ever acquired a runtime import.
#
# One test file does need a dependency. test_hypothesis_properties.py uses
# Hypothesis (see requirements-dev.txt for the Ruling 001 §5 record) and is
# therefore run only after the dev install, in a later step.

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The engine prints box-drawing characters and emoji.
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        # The README claims 3.10+; test the floor and the current release.
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Runs BEFORE any install. This step is the standing proof that the
      # engine and its core suite need no third-party package.
      - name: Run core test suite (no dependencies installed)
        run: python -m unittest test_engine -v

      - name: Install dev dependencies (test-only)
        run: python -m pip install -r requirements-dev.txt

      # Discovery now picks up every test_*.py, including the property tests.
      # test_engine runs a second time here; it takes ~0.1s and keeps discovery
      # authoritative so a future test file is never silently skipped.
      - name: Run full suite including property tests
        run: python -m unittest discover -p "test_*.py" -v

      - name: Smoke-test the standalone lore generator
        run: python fantasy_kingdom_generator.py

      - name: Smoke-test the full fusion pipeline
        run: python mythos_sync.py
