# Tests the Mythos-Sync engine on every push and pull request.
#
# No install step: WorldCraft-Visuals is standard-library only, and the test
# suite uses unittest rather than pytest to keep it that way.

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The engine prints box-drawing characters and emoji.
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        # The README claims 3.10+; test the floor and the current release.
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        run: python -m unittest discover -p "test_*.py" -v

      - name: Smoke-test the standalone lore generator
        run: python fantasy_kingdom_generator.py

      - name: Smoke-test the full fusion pipeline
        run: python mythos_sync.py
